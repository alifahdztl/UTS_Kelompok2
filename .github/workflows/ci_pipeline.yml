name: Python CI Pipeline - KopiLoka

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil Kode dari Repositori (Checkout)
      uses: actions/checkout@v4

    - name: Menyiapkan Lingkungan Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Menginstal Dependensi Proyek
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint code with flake8
      run: |
        flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Menjalankan Automated Unit Testing (Pytest)
      run: |
        python -m pytest -v